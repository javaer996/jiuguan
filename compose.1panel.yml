# 醉语 · 1Panel Docker Compose
#
# 用法：
# 1. 在 1Panel「容器 → 编排」中新建应用，粘贴本文件；
# 2. 在应用目录创建 .env（可参考 compose.1panel.env.example），填写数据库与密钥；
# 3. 启动。首次会拉取代码、npm ci、next build，通常需要 5-10 分钟；
# 4. 之后更新代码：重启/重建本应用（或 docker compose up -d --force-recreate），
#    入口脚本会 git fetch；node_modules、.next、npm 缓存都会复用，不会每次重装。
#
# 重要：本服务故意不写 image:。
# 1Panel 更新时可能先执行 docker compose pull；只写 build: 时 pull 会跳过本服务，
# 否则它会去远程拉取同名镜像而失败。

name: jiuguan

services:
  jiuguan:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        ENV NEXT_TELEMETRY_DISABLED=1
        RUN apt-get update \
         && apt-get install -y --no-install-recommends git ca-certificates tzdata \
         && rm -rf /var/lib/apt/lists/*
        WORKDIR /app

    container_name: jiuguan
    restart: unless-stopped
    init: true

    # 1Panel 反向代理指向宿主机这个端口；被占用时在 .env 里改 APP_PORT。
    ports:
      - "${APP_PORT:-3000}:3000"

    # 如果 MySQL 装在宿主机上，可用 host.docker.internal 连接。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      PORT: "3000"
      TZ: Asia/Shanghai
      NEXT_TELEMETRY_DISABLED: "1"
      REPO_URL: "${REPO_URL:-https://github.com/javaer996/jiuguan.git}"
      REPO_BRANCH: "${REPO_BRANCH:-main}"
      DATABASE_URL: "${DATABASE_URL:?请在 compose 项目的 .env 中配置 DATABASE_URL}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      AUTH_SECRET: "${AUTH_SECRET:?请在 compose 项目的 .env 中配置 AUTH_SECRET}"
      API_KEY_ENC_SECRET: "${API_KEY_ENC_SECRET:?请在 compose 项目的 .env 中配置 API_KEY_ENC_SECRET}"
      APP_URL: "${APP_URL:?请在 compose 项目的 .env 中配置 APP_URL}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_DISPLAY_NAME: "${ADMIN_DISPLAY_NAME:-掌柜}"
      ALLOW_PRIVATE_PROVIDER_URLS: "${ALLOW_PRIVATE_PROVIDER_URLS:-false}"
      UPLOAD_DIR: /app/public/uploads
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-8}"

    volumes:
      # 代码、node_modules、.next 都放在这里，重建容器不会丢，依赖和构建产物可复用。
      - ./app:/app
      # 上传文件单独持久化；不要放进会被 git reset/clean 的路径。
      - ./uploads:/app/public/uploads
      # npm 下载缓存，node_modules 被删除后重装也能命中缓存。
      - ./npm-cache:/root/.npm

    command:
      - sh
      - -c
      - |
        set -eu
        APP=/app
        cd "$$APP"

        git config --global --add safe.directory "$$APP"
        export GIT_TERMINAL_PROMPT=0

        if [ ! -d .git ]; then
          echo "[启动] 初始化仓库"
          git init -q
          git remote add origin "$$REPO_URL"
        fi
        git remote set-url origin "$$REPO_URL"

        echo "[启动] 拉取代码分支: $$REPO_BRANCH"
        if git fetch origin "$$REPO_BRANCH"; then
          TARGET=FETCH_HEAD
        elif git rev-parse --verify HEAD >/dev/null 2>&1; then
          echo "[启动] 拉取失败，继续使用本地已有代码"
          TARGET=HEAD
        else
          echo "[启动] 拉取失败，且本地没有可用代码" >&2
          exit 1
        fi

        # app 目录由容器接管；清掉未跟踪且未忽略的文件，避免 checkout 冲突。
        # 显式保留依赖、构建产物和上传目录，防止首次还没有 .gitignore 时误删。
        CLEAN_EXCLUDES="-e public/uploads -e node_modules -e .next"
        # shellcheck disable=SC2086
        git clean -fd $$CLEAN_EXCLUDES
        git checkout -B "$$REPO_BRANCH" "$$TARGET"
        git reset --hard "$$TARGET"
        # shellcheck disable=SC2086
        git clean -fd $$CLEAN_EXCLUDES

        # 只有 package.json / package-lock.json 或 Node 版本变化时才重装依赖。
        STAMP=node_modules/.install-stamp
        NODE_TAG=$$(node -v)
        LOCK_HASH="$$(cat package.json package-lock.json | cksum | awk '{print $$1"-"$$2}')-$$NODE_TAG"
        if [ ! -f "$$STAMP" ] || [ "$$(cat "$$STAMP")" != "$$LOCK_HASH" ]; then
          echo "[启动] 安装依赖（使用挂载的 npm 缓存）"
          npm ci --no-audit --no-fund
          echo "$$LOCK_HASH" > "$$STAMP"
        else
          echo "[启动] 依赖无变化，跳过安装"
        fi

        export NODE_ENV=production

        # 只有 commit 或 Node 版本变化时才重新构建。
        BUILD_STAMP=.next/.build-commit
        BUILD_KEY="$$(git rev-parse HEAD)-$$NODE_TAG"
        if [ ! -f "$$BUILD_STAMP" ] || [ "$$(cat "$$BUILD_STAMP")" != "$$BUILD_KEY" ]; then
          echo "[启动] 构建 Next.js 产物（首次可能需要几分钟）"
          npm run build
          echo "$$BUILD_KEY" > "$$BUILD_STAMP"
        else
          echo "[启动] 代码未变化，跳过构建"
        fi

        # 等待 MySQL 就绪，并在库不存在时自动创建。
        echo "[启动] 等待并检查数据库"
        node -e '
        const mysql = require("mysql2/promise");
        const FATAL = new Set([
          "ER_ACCESS_DENIED_ERROR",
          "ER_DBACCESS_DENIED_ERROR",
          "ER_NOT_SUPPORTED_AUTH_MODE",
          "ER_BAD_DB_ERROR",
          "ER_PARSE_ERROR",
        ]);
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        (async () => {
          const target = new URL(process.env.DATABASE_URL);
          const name = decodeURIComponent(target.pathname.replace(/^\//, ""));
          if (!name) throw new Error("DATABASE_URL 缺少数据库名");
          target.pathname = "/";

          let server;
          for (let i = 0; i < 60; i += 1) {
            try {
              server = await mysql.createConnection({
                uri: target.toString(),
                connectTimeout: 5000,
              });
              break;
            } catch (error) {
              const code = (error && error.code) || "UNKNOWN";
              if (i === 0 || FATAL.has(code)) {
                console.error("[启动] 连接 MySQL 失败（" + code + "）：" + error.message);
              }
              if (FATAL.has(code)) process.exit(1);
              if (i === 59) {
                console.error("[启动] MySQL 180 秒内仍不可用");
                process.exit(1);
              }
              await sleep(3000);
            }
          }

          try {
            try {
              const db = await mysql.createConnection({
                uri: process.env.DATABASE_URL,
                connectTimeout: 5000,
              });
              await db.end();
            } catch (error) {
              if (error.code !== "ER_BAD_DB_ERROR") throw error;
              await server.query(
                "CREATE DATABASE IF NOT EXISTS ?? CHARACTER SET utf8mb4",
                [name],
              );
              console.log("[启动] 数据库 " + name + " 不存在，已自动创建");
            }
          } finally {
            await server.end();
          }
        })().catch((error) => {
          console.error("[启动] 数据库检查失败（" + (error.code || "UNKNOWN") + "）：" + error.message);
          console.error("[启动] 请检查 DATABASE_URL 的用户名、密码（特殊字符需 URL 编码）和账号权限");
          process.exit(1);
        });
        '

        # 迁移与 seed 都是幂等的，每次启动跑一遍没有副作用。
        # 如果没有设置 ADMIN_PASSWORD，seed 会随机生成，并在日志里打印一次。
        if [ -z "$${ADMIN_PASSWORD:-}" ]; then
          unset ADMIN_PASSWORD
        fi
        echo "[启动] 应用数据库迁移"
        npm run db:migrate
        echo "[启动] 执行 seed（首次会打印邀请码 / 随机密码）"
        npm run db:seed

        echo "[启动] 启动服务，端口 $$PORT"
        exec ./node_modules/.bin/next start -p "$$PORT" -H 0.0.0.0

    # /api/health 会检查数据库；首次构建可能较久，start_period 留足 10 分钟。
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
