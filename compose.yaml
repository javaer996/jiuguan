name: jiuguan

x-build: &jiuguan-build
  context: .
  dockerfile_inline: |
    # syntax=docker/dockerfile:1.7
    FROM node:22-alpine AS base
    RUN apk add --no-cache libc6-compat
    WORKDIR /app
    ENV NEXT_TELEMETRY_DISABLED=1

    # ---- 依赖安装：利用 BuildKit 缓存，源码变化时无需重装 ----
    FROM base AS deps
    COPY package.json package-lock.json .npmrc ./
    RUN --mount=type=cache,target=/root/.npm \
        npm ci

    # ---- 构建 Next.js standalone 产物 ----
    FROM base AS builder
    COPY --from=deps /app/node_modules ./node_modules
    COPY . .
    RUN npm run build

    # ---- 迁移 / 种子脚本运行环境 ----
    FROM base AS migrator
    ENV NODE_ENV=production
    COPY package.json package-lock.json .npmrc ./
    COPY --from=deps /app/node_modules ./node_modules
    COPY drizzle ./drizzle
    COPY scripts ./scripts
    COPY src ./src
    COPY tsconfig.json drizzle.config.ts ./
    CMD ["npm", "run", "db:migrate"]

    # ---- 生产运行镜像 ----
    FROM base AS runner
    ENV NODE_ENV=production
    ENV PORT=3000
    ENV HOSTNAME=0.0.0.0
    RUN addgroup -S nodejs && adduser -S nextjs -G nodejs \
        && mkdir -p /app/public/uploads \
        && chown -R nextjs:nodejs /app/public
    COPY --from=builder /app/public ./public
    COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
    COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
    USER nextjs
    EXPOSE 3000
    CMD ["node", "server.js"]

services:
  migrate:
    image: jiuguan:migrator
    build:
      <<: *jiuguan-build
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
    restart: "no"

  seed:
    image: jiuguan:migrator
    build:
      <<: *jiuguan-build
      target: migrator
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-掌柜}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    image: jiuguan:${TAG:-latest}
    build:
      <<: *jiuguan-build
      target: runner
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中配置 AUTH_SECRET}
      API_KEY_ENC_SECRET: ${API_KEY_ENC_SECRET:?请在 .env 中配置 API_KEY_ENC_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-掌柜}
      ALLOW_PRIVATE_PROVIDER_URLS: ${ALLOW_PRIVATE_PROVIDER_URLS:-false}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      UPLOAD_DIR: /app/public/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  uploads:
